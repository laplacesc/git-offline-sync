<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Git 离线同步</title>
  <script src="./theme.js"></script>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="scene" class="scene" aria-hidden="true">
    <canvas id="shader-canvas" width="1" height="1" aria-hidden="true"></canvas>
  </div>
  <a class="skip" href="#content">跳到内容</a>
  <div class="app">
    <header class="header">
      <span class="logo" aria-hidden="true">
        <svg viewBox="236 300 552 424" fill="none" focusable="false">
          <g stroke="currentColor" stroke-width="58" stroke-linecap="round" stroke-linejoin="round">
            <path d="M372 420H692M616 344L692 420L616 496M652 604H332M408 528L332 604L408 680" />
          </g>
          <g fill="currentColor">
            <circle cx="316" cy="420" r="50" />
            <circle cx="708" cy="604" r="50" />
          </g>
        </svg>
      </span><span class="app-name">Git 离线同步</span>
      <div class="header-actions">
        <button class="project-button" data-action="project">Threat Intelligence <span aria-hidden="true">⌄</span></button>
        <span id="role-badge" class="badge">内网</span>
        <details class="appearance" id="appearance">
          <summary class="icon-button" aria-label="外观：跟随系统" title="外观：跟随系统">
            <svg id="appearance-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8m-4-4v4"/></svg>
          </summary>
          <fieldset class="appearance-menu">
            <legend class="sr-only">外观</legend>
            <label><input type="radio" name="theme" value="light">浅色</label>
            <label><input type="radio" name="theme" value="dark">深色</label>
            <label><input type="radio" name="theme" value="system" checked>跟随系统</label>
          </fieldset>
        </details>
        <button class="icon-button" data-action="settings" aria-label="设置" title="设置">⚙</button>
      </div>
    </header>
    <div class="workspace">
      <nav id="tabs" aria-label="同步操作"></nav>
      <div class="location"><span class="location-icon" aria-hidden="true">▱</span><span class="path">OFFLINE_USB / ti</span><button class="text-button" data-action="location">更改</button><button class="refresh" data-action="refresh" aria-label="刷新" title="刷新">↻</button></div>
      <main id="content" tabindex="-1"></main>
      <div id="progress" class="progress" hidden aria-live="polite"></div>
      <footer class="footer"><span id="latest"></span><button class="text-button" data-action="history">查看记录</button></footer>
    </div>
  </div>
  <details class="demo-controls">
    <summary>原型演示 · 模拟数据</summary>
    <div class="demo-fields">
      <label>环境 <select id="role"><option value="internal">内网</option><option value="external">外网</option></select></label>
      <label>场景 <select id="scenario"><option value="normal">正常</option><option value="missing">缺包</option><option value="conflict">整理冲突</option><option value="exportInterrupted">导出中断</option><option value="unknown">推送结果待核实</option><option value="corrupt">记录读取失败</option><option value="collision">包内容冲突</option><option value="empty">首次使用</option></select></label>
      <button id="reset" class="text-button">重置</button>
    </div>
  </details>
  <dialog id="dialog" aria-labelledby="dialog-title"><div id="dialog-content"></div></dialog>
  <div id="toast" role="status" class="toast"></div>
  <script src="./shader.js"></script>
  <script src="./app.js"></script>
</body>
</html>
