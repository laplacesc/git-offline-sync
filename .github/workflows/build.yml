# PR/branch validation never builds installers or reads signing secrets.
# Tag/manual builds stage every bundle before a tag release is published atomically.
name: build

on:
  pull_request:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    name: validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - uses: pnpm/action-setup@v4
        with:
          # Read the exact version from packageManager; standalone also avoids
          # depending on the action runner's own Node version (pnpm 11 needs >=22.13).
          standalone: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:version
      - name: Inspect Windows argument forwarding
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-Command pnpm -All | Format-List CommandType, Name, Source
          $probe = Join-Path $env:RUNNER_TEMP 'argv-probe.cjs'
          Set-Content -Path $probe -Value 'console.log(JSON.stringify(process.argv.slice(2)))'
          node $probe -- --locked
          pnpm exec node $probe -- --locked
          pnpm exec node $probe '--' --locked
      - run: pnpm test
      - run: pnpm build
      - name: Rust format
        working-directory: src-tauri
        run: cargo fmt --all -- --check
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked
      - name: Rust clippy
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

  build:
    needs: test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    name: build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Offline WebView2 installer, for first-time offline installation.
          - os: windows-latest
            label: windows-with-webview2
            args: ""
          # Small updater/installer for machines with WebView2 already installed.
          - os: windows-latest
            label: windows-no-webview2
            args: "--config src-tauri/tauri.windows-slim.conf.json"
          - os: macos-latest
            label: macos-universal
            args: "--target universal-apple-darwin"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - uses: pnpm/action-setup@v4
        with:
          standalone: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:version
      # The Node driver inserts Cargo arguments without shell/shim parsing.
      - run: node scripts/build.mjs --ci --config src-tauri/tauri.release.conf.json ${{ matrix.args }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
      - name: Validate and stage this platform's installers and signatures
        run: node scripts/release.mjs stage ${{ matrix.label }} release-assets
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.label }}
          path: release-assets/*
          if-no-files-found: error

  release:
    name: Verify all assets, then publish the draft
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - uses: actions/download-artifact@v4
        with:
          pattern: bundle-*
          path: bundles
          merge-multiple: true
      - name: Preflight installers, updater archives, signatures and latest.json
        run: node scripts/release.mjs preflight bundles
      # A public release is never reset to draft, overwritten or deleted.
      # Failures leave only a draft; a retry can replace its partial assets.
      - name: Upload to draft, verify downloaded SHA-256, then publish
        run: node scripts/release.mjs publish bundles
        env:
          GH_TOKEN: ${{ github.token }}
