# 在 Windows 与 macOS 上分别构建安装包（Tauri 不支持交叉编译）。
# 手动触发或推送 v* 标签时运行；标签构建成功后自动发布到 GitHub Release。
name: build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Rust 测试（含端到端同步流程）
        working-directory: src-tauri
        run: cargo test

  build:
    needs: test
    name: build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 内置 WebView2 离线安装包，装机时无需联网（体积大）
          - os: windows-latest
            label: windows-with-webview2
            suffix: "-with-webview2"
            args: ""
          # 不打包 WebView2，缺少运行时时安装程序联网下载引导程序（体积小）
          - os: windows-latest
            label: windows-no-webview2
            suffix: "-no-webview2"
            args: "--config src-tauri/tauri.windows-slim.conf.json"
          - os: macos-latest
            label: macos-universal
            args: "--target universal-apple-darwin"
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      # tauri.release.conf.json 开启 createUpdaterArtifacts：用私钥为安装包生成 .sig，供应用内更新校验
      - run: pnpm tauri build --config src-tauri/tauri.release.conf.json ${{ matrix.args }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
      # 两个 Windows 安装包默认同名，加后缀以便放进同一个 Release（签名文件一起改名）
      - name: 重命名 Windows 安装包
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object {
            $name = $_.BaseName + '${{ matrix.suffix }}' + $_.Extension
            Rename-Item -Path "$($_.FullName).sig" -NewName "$name.sig"
            Rename-Item -Path $_.FullName -NewName $name
          }
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.label }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error

  release:
    name: 发布安装包到 Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bundle-*
          path: bundles
          merge-multiple: true
      # macOS 更新包默认不带版本号，改成与 dmg 一致的命名
      - name: 整理更新包
        run: |
          version="${GITHUB_REF_NAME#v}"
          tarball=$(find bundles -name '*.app.tar.gz')
          dir=$(dirname "$tarball")
          mv "$tarball" "$dir/GitOfflineSync_${version}_universal.app.tar.gz"
          mv "$tarball.sig" "$dir/GitOfflineSync_${version}_universal.app.tar.gz.sig"
      - name: 创建或更新 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            bundles/**/*-with-webview2.exe
            bundles/**/*-no-webview2.exe
            bundles/**/*.dmg
            bundles/**/*.app.tar.gz
      # 应用内更新读取 releases/latest/download/latest.json。
      # Windows 用不带 WebView2 的安装包更新（能运行说明本机已有 WebView2）；macOS 为 universal 包。
      - name: 生成并上传 latest.json
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          win=$(basename "$(find bundles -name '*-no-webview2.exe')")
          mac=$(basename "$(find bundles -name '*.app.tar.gz')")
          win_sig=$(cat "$(find bundles -name "$win.sig")")
          mac_sig=$(cat "$(find bundles -name "$mac.sig")")
          notes=$(gh release view "$GITHUB_REF_NAME" --json body -q .body)
          jq -n \
            --arg version "$version" \
            --arg notes "$notes" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg win_url "$base/$win" --arg win_sig "$win_sig" \
            --arg mac_url "$base/$mac" --arg mac_sig "$mac_sig" \
            '{version: $version, notes: $notes, pub_date: $date, platforms: {
              "windows-x86_64": {url: $win_url, signature: $win_sig},
              "darwin-aarch64": {url: $mac_url, signature: $mac_sig},
              "darwin-x86_64": {url: $mac_url, signature: $mac_sig}
            }}' > latest.json
          cat latest.json
          gh release upload "$GITHUB_REF_NAME" latest.json --clobber
