# 在 Windows 与 macOS 上分别构建安装包（Tauri 不支持交叉编译）。
# 手动触发或推送 v* 标签时运行；标签构建成功后自动发布到 GitHub Release。
name: build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Rust 测试（含端到端同步流程）
        working-directory: src-tauri
        run: cargo test

  build:
    needs: test
    name: build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 内置 WebView2 离线安装包，装机时无需联网（体积大）
          - os: windows-latest
            label: windows-with-webview2
            suffix: "-with-webview2"
            args: ""
          # 不打包 WebView2，缺少运行时时安装程序联网下载引导程序（体积小）
          - os: windows-latest
            label: windows-no-webview2
            suffix: "-no-webview2"
            args: "--config src-tauri/tauri.windows-slim.conf.json"
          - os: macos-latest
            label: macos-universal
            args: "--target universal-apple-darwin"
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build ${{ matrix.args }}
      # 两个 Windows 安装包默认同名，加后缀以便放进同一个 Release
      - name: 重命名 Windows 安装包
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object {
            Rename-Item -Path $_.FullName -NewName ($_.BaseName + '${{ matrix.suffix }}' + $_.Extension)
          }
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.label }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  release:
    name: 发布安装包到 Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bundle-*
          path: bundles
          merge-multiple: true
      - name: 创建或更新 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            bundles/**/*-with-webview2.exe
            bundles/**/*-no-webview2.exe
            bundles/**/*.dmg
