# 在 Windows 与 macOS 上分别构建安装包（Tauri 不支持交叉编译）。
# 手动触发或推送 v* 标签时运行；产物在 Actions 页面的 Artifacts 中下载。
name: build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Rust 测试（含端到端同步流程）
        working-directory: src-tauri
        run: cargo test

  build:
    needs: test
    name: build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 内置 WebView2 离线安装包，装机时无需联网（体积大）
          - os: windows-latest
            label: windows-with-webview2
            suffix: "-with-webview2"
            args: ""
          # 不打包 WebView2，缺少运行时时安装程序联网下载引导程序（体积小）
          - os: windows-latest
            label: windows-no-webview2
            suffix: "-no-webview2"
            args: "--config src-tauri/tauri.windows-slim.conf.json"
          - os: macos-latest
            label: macos-universal
            args: "--target universal-apple-darwin"
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build ${{ matrix.args }}
      # 两个 Windows 安装包默认同名，加后缀以便放进同一个 Release
      - name: 重命名 Windows 安装包
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object {
            Rename-Item -Path $_.FullName -NewName ($_.BaseName + '${{ matrix.suffix }}' + $_.Extension)
          }
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.label }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: ignore
